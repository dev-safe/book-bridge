[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3"
axum = "0.8.9"
bigdecimal = { version = "0.4", features = ["serde"] }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
connectrpc = { version = "0.9", features = ["axum", "server"] }
diesel = { version = "2.3.12", features = ["chrono", "numeric", "postgres", "r2d2", "serde_json", "uuid", "without-deprecated"] }
diesel_migrations = { version = "2.3", features = ["postgres"] }
dotenvy = "0.15.7"
h3o = "0.6"
http = "1.5.0"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
pq-sys = { version = "0.7", features = ["bundled"] }
rand = "0.10.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[profile.dev]
debug = "line-tables-only"
