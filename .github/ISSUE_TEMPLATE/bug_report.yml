name: Bug report
description: Something in the app, landing page, or backend isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste passwords, tokens, API keys, phone numbers, or payment details.**
        For security vulnerabilities, do not open a public issue — contact the maintainers privately.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mobile app (Flutter)
        - Payments / escrow
        - Landing page (web)
        - Backend (Supabase / Rust core)
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, or the APK release tag.
      placeholder: e.g. v2.0.0
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: e.g. Tecno Spark 10, Android 13
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Redact any personal data before attaching.
